# Full-corpus configuration. Scale to this ONLY after prototype-v0.1 passes
# all 12 validation points (see README, "Prototype checklist").
#
# Coverage: frontend, backend, APIs/business logic, SQL/NoSQL, server &
# infrastructure, Docker/K8s/CI-CD, testing, configuration, multi-language
# repositories, plus real git commits and GitHub issues.

pipeline_version: "0.1.0"

paths:
  workspace: "./workspace"
  keep_local_processed: false

hf:
  target_repo: "CHANGE-ME/unified-real-world-code"
  private: true
  mode: real
  upload_excluded_reports: true
  max_retries: 5

queue:
  max_local_shards: 5
  download_workers: 3
  process_workers: 1
  max_retries: 4
  retry_backoff_base_s: 60
  retry_backoff_max_s: 3600
  min_free_disk_gb: 50
  status_interval_s: 60

shard:                       # raw shard size in GB (1 GB = 10^9 bytes)
  target_gb: 1.5
  min_gb: 1.0
  max_gb: 2.0

processing:
  batch_size: 500000
  upload_per_batch: true       # upload each processed batch immediately
  checkpoint_after: [normalize, dedup_near, secrets_scan]  # shard-mode only
  parquet_compression: zstd
  parquet_row_group_size: 65536   # + parquet_row_group_max_mb: 64 byte cap
  token_counter: heuristic
  cpu_workers: 0               # 0 = auto; per-record CPU work process pool

dedup:
  exact: {enabled: true}
  near:
    enabled: true
    mode: annotate
    num_perm: 128
    bands: 16
    jaccard_threshold: 0.75
    shingle_size: 5
    min_tokens: 30
    exempt_record_types: [commit, issue]

licenses:
  permissive_action: keep
  weak_copyleft_action: flag
  strong_copyleft_action: drop
  unknown_action: flag
  source_level_permissive: [starcoderdata, starcoder2data_extras]

secrets:
  enabled: true
  redact_emails: true
  redact_ips: true
  max_hits_per_file: 20
  drop_env_like_files: true

quality:
  min_content_chars: 2
  max_content_bytes: 1048576
  minified_avg_line_len: 250.0
  minified_max_line_len: 10000
  max_base64_run: 2048
  repeated_line_ratio: 0.10
  min_alnum_ratio: 0.20
  lockfile_max_bytes: 204800
  drop_flags: [binary_like, empty, too_large, minified, vendored,
               data_blob_heavy, repeated_content, generated_metadata,
               lockfile_large, low_alnum]
  flag_only: [generated_marker, lockfile, suspicious_obfuscation]

complexity:
  min_file_tokens: 4
  drop_below_min_tokens: true

subsets:
  materialize_high_quality: true
  high_quality_min_score: null

prototype:
  max_total_shards: null     # no global cap for the full corpus

sources:
  common_pile_stackv2:
    enabled: true
    repo_id: common-pile/stackv2
    file_patterns: ["documents/*_stackv2.jsonl.gz", "*_stackv2.jsonl.gz"]
    max_shards: null

  common_pile_stackv2_edu:
    enabled: true
    repo_id: common-pile/stackv2_edu_filtered
    file_patterns: ["stack-edu-*.json.gz", "*/stack-edu-*.json.gz"]
    max_shards: null

  starcoder2data_extras:
    enabled: true
    repo_id: bigcode/starcoder2data-extras
    include_configs: [issues, documentation]
    max_shards: null

  starcoderdata:
    enabled: true
    repo_id: bigcode/starcoderdata
    include_dirs: [python, javascript, typescript, sql, go, rust, java, c,
                   cpp, c-sharp, php, ruby, kotlin, swift, scala, shell,
                   dockerfile, yaml, json, html, css, hcl, makefile, cmake,
                   protocol-buffer, markdown,
                   git-commits-cleaned, github-issues-filtered-structured,
                   jupyter-scripts-dedup-filtered]
    max_shards: null

  the_stack_v2:
    enabled: true
    repo_id: bigcode/the-stack-v2
    languages: [Python, JavaScript, TypeScript, SQL, Go, Rust, Java, C, C++,
                C-Sharp, PHP, Ruby, Kotlin, Swift, Scala, Shell, Dockerfile,
                YAML, JSON, HTML, CSS, HCL, Makefile, CMake, Vue, Svelte]
    shard_gb: null             # inherit shard.target_gb; set to override
    est_file_size_kb: 12       # avg file-size estimate -> per-shard budget
    max_files_per_language: null
    max_shards: null
    swh:
      bucket: softwareheritage
      prefix: content
      max_fetch_threads: 32
      max_missing_ratio: 0.05
