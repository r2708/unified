[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-code-corpus"
version = "0.1.0"
description = "Shard-streamed, crash-resumable pipeline that builds a deduplicated, provenance-aware, license-aware, repository-level real-world code corpus and publishes it to the Hugging Face Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.24.0",
    "pyarrow>=15.0.0",
    "numpy>=1.24",
    "datasketch>=2.0,<3",
    "xxhash>=3.4.1",
    "boto3>=1.34",
    "requests>=2.31",
    "certifi>=2024.2.2",
    "PyYAML>=6.0",
    "orjson>=3.9",
    "tqdm>=4.66",
    "zstandard>=0.22",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]

[project.scripts]
ucc = "ucc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
